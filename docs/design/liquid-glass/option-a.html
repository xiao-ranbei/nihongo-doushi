<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>言の葉 · 方案 A · 纸感延续 · UI 原型</title>
<style>
/* 共享布局骨架：三方案完全一致的信息架构、视图结构与交互热区。
 * 颜色 / 字号 / 间距 / 圆角 / 阴影 / 材质参数全部走 var(--*)，由 theme-*.css 提供。
 */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Hiragino Sans","Yu Gothic","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;background:var(--stage-bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
#app{max-width:520px;margin:0 auto;padding:14px 12px 26px;min-height:100vh}

/* 预览控制条（原型工具，非 App UI） */
.toolbar{display:flex;flex-direction:column;gap:7px;margin-bottom:12px;padding:10px;border:1px solid var(--stage-line);border-radius:10px;background:var(--stage-panel)}
.toolbar-row{display:flex;align-items:center;gap:8px;min-height:28px}
.toolbar-row>.t-micro{width:30px;flex:none;color:var(--stage-text)}
.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--stage-line);border-radius:7px;background:var(--stage-panel)}
.seg-btn{min-height:28px;padding:3px 9px;border-radius:5px;font-size:11px;color:var(--stage-text);white-space:nowrap}
.seg-btn.is-on{background:var(--stage-on);color:var(--stage-on-text);font-weight:600}
.select{min-height:28px;padding:3px 8px;border:1px solid var(--stage-line);border-radius:6px;background:var(--stage-panel);font-size:11px;color:var(--stage-text)}
.toolbar-row .btn{flex:none}

/* 设备框 */
.device{width:100%;max-width:390px;margin:0 auto;border:1px solid var(--device-line);border-radius:var(--radius-device);background:var(--bg);box-shadow:var(--shadow-device);overflow:hidden}
.device-inner{height:720px;position:relative}
.screen-shell{position:relative;display:flex;flex-direction:column;height:100%;background:var(--bg);overflow:hidden}
.screen-shell::before{content:"";position:absolute;inset:0;background:var(--screen-texture);pointer-events:none;z-index:0}
.topbar,.content,.tabbar{position:relative;z-index:1}
.topbar{flex:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 var(--sp-page);border-bottom:var(--border-w) solid var(--line);background:var(--topbar-bg)}
.topbar-main{display:flex;flex-direction:column;gap:1px}
.t-brand{font-size:var(--fs-title);font-weight:600;letter-spacing:.08em;color:var(--text)}
.topbar-spacer{flex:1}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:auto;flex:none}
.back{display:flex;align-items:center;gap:4px;min-height:44px;padding-right:12px;color:var(--brand)}
.back>span[aria-hidden]{font-size:24px;line-height:1}
.topbar>.t-title{flex:1;text-align:center;margin-right:44px}

.content{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.page{display:flex;flex-direction:column;gap:var(--sp-gap);padding:var(--sp-page);padding-bottom:calc(var(--sp-page) + 10px)}
.page.with-dock{padding-bottom:calc(var(--sp-page) + 4px)}
.hero{display:flex;flex-direction:column;gap:6px;padding:var(--sp-card) 0 calc(var(--sp-card) / 2)}
.hero.compact{padding-top:calc(var(--sp-card) / 2)}
.hero .t-body{color:var(--text-2)}
.section{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:var(--sp-section);color:var(--text-3)}
.section-more{font-size:var(--fs-micro);color:var(--text-3)}
.hint{font-size:var(--fs-micro);line-height:1.6;color:var(--text-3);margin:2px 0 0}

/* 排版层级：三方案各自用 --fs-* 定义节奏 */
.t-display{font-size:var(--fs-display);line-height:1.25;font-weight:600;letter-spacing:.01em;margin:0;color:var(--text)}
.t-title{font-size:var(--fs-title);line-height:1.4;font-weight:var(--fw-title);margin:0;color:var(--text)}
.t-body{font-size:var(--fs-body);line-height:var(--lh-body);margin:0;color:var(--text-2)}
.t-caption{font-size:var(--fs-caption);line-height:1.5;color:var(--text-3)}
.t-label{font-size:var(--fs-label);line-height:1.4;letter-spacing:.06em;color:var(--text-3)}
.t-micro{font-size:var(--fs-micro);line-height:1.4;color:var(--text-3)}
.t-jp{font-size:var(--fs-jp);line-height:1.65;letter-spacing:.04em;margin:0;color:var(--text)}
.t-jp.small{font-size:calc(var(--fs-jp) - 3px)}
.t-number{font-size:var(--fs-number);font-weight:600;line-height:1.1;color:var(--text)}
b{font-weight:600;color:var(--text)}

/* 卡片 / 网格 */
.card{position:relative;display:flex;flex-direction:column;gap:6px;padding:var(--sp-card);border:var(--border-w) solid var(--line);border-radius:var(--radius-card);background:var(--surface);box-shadow:var(--shadow-card);color:var(--text)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-gap)}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-gap)}
.row-card{flex-direction:row;align-items:center;gap:10px}
.row-main{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.row-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.proverb{gap:8px}
.proverb .row-actions{margin-top:2px}
.entry{flex-direction:row;align-items:center;gap:10px;text-align:left;min-height:74px;width:100%;transition:transform .16s ease,border-color .16s ease}
.entry:hover,.form:hover{border-color:var(--brand)}
.entry-main{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.entry-arrow{width:8px;height:8px;border-top:1.5px solid var(--text-3);border-right:1.5px solid var(--text-3);transform:rotate(45deg);flex:none;margin-right:3px}
.glyph{display:flex;align-items:center;justify-content:center;width:38px;height:38px;flex:none;border-radius:var(--radius-glyph);font-size:15px;font-weight:600;background:var(--brand-soft);color:var(--brand-ink);border:var(--border-w) solid var(--glyph-line)}
.glyph[data-tone="muted"]{background:var(--surface-2);color:var(--text-3)}
.badge{display:inline-flex;align-items:center;min-height:20px;padding:1px 8px;border-radius:var(--radius-pill);font-size:var(--fs-micro);line-height:1.3;white-space:nowrap;border:var(--border-w) solid transparent;background:var(--surface-2);color:var(--text-3)}
.badge[data-kind="ok"]{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.badge[data-kind="warn"]{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.badge[data-kind="soft"]{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand-line)}
.badge[data-kind="muted"]{background:transparent;color:var(--text-3);border-color:var(--line)}
.planned{flex-direction:row;align-items:center;gap:10px;opacity:.72;cursor:not-allowed}
.form{align-items:flex-start;min-height:78px;text-align:left;gap:2px}
.voice-row{display:flex;gap:var(--sp-gap);overflow-x:auto;padding-bottom:2px}
.voice{flex:1;min-width:92px;gap:4px}
.stat{align-items:flex-start;gap:4px}
.stat .t-number{margin-top:2px}
.profile{flex-direction:row;align-items:center;gap:10px}
.para{align-items:flex-start;gap:5px;text-align:left;width:100%}
.para-jp{margin:2px 0}
.prompt{align-items:flex-start;gap:8px;padding:calc(var(--sp-card) + 4px)}
.week{display:flex;align-items:flex-end;justify-content:space-between;gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0}
.day-bar{width:10px;min-height:4px;border-radius:3px;background:var(--surface-2)}
.day.is-today .day-bar{background:var(--brand)}
.day.is-today .t-micro{color:var(--brand);font-weight:600}
.stat-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:8px;border-top:var(--border-w) solid var(--line)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 14px;border:var(--border-w) dashed var(--line);border-radius:var(--radius-card);background:var(--surface);text-align:center}
.empty.slim{border:0;padding:18px 8px;background:transparent}
.empty-mark{width:34px;height:34px;border:2px solid var(--line);border-radius:8px;position:relative}
.empty-mark::after{content:"";position:absolute;inset:8px;border:1px solid var(--line);border-radius:3px}
.empty .t-body{max-width:240px}
.table{display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden}
.table-row{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px var(--sp-card);border-bottom:var(--border-w) solid var(--line)}
.table-row:last-child{border-bottom:0}
.table-row>.t-body{flex:1}
.table-row>.t-jp{flex:1}

/* 控件 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:var(--border-w) solid var(--line);border-radius:var(--radius-btn);font-size:var(--fs-body);font-weight:500;background:var(--surface-2);color:var(--text);white-space:nowrap;transition:filter .16s ease,border-color .16s ease}
.btn:hover{filter:brightness(.97);border-color:var(--brand)}
.btn:active{transform:translateY(1px)}
.btn-small{min-height:36px;padding:0 11px;font-size:var(--fs-caption)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-on)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--brand)}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border:var(--border-w) solid var(--line);border-radius:var(--radius-pill);font-size:var(--fs-body);background:var(--surface-2);color:var(--text-2)}
.pill.is-on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.input{width:100%;min-height:44px;padding:8px 12px;border:var(--border-w) solid var(--line);border-radius:var(--radius-btn);background:var(--surface-2);color:var(--text);font-size:var(--fs-body)}
.input::placeholder{color:var(--text-3)}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}

/* 答题 */
.practice-head{display:flex;flex-direction:column;gap:8px}
.progress{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress>span{display:block;height:100%;background:var(--brand);transition:width .25s ease}
.options{display:flex;flex-direction:column;gap:var(--sp-gap)}
.option{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px var(--sp-card);border:var(--border-w) solid var(--line);border-radius:var(--radius-card);background:var(--surface);color:var(--text)}
.option>.t-body{flex:1}
.option-key{display:flex;align-items:center;justify-content:center;width:28px;height:28px;flex:none;border-radius:var(--radius-glyph);background:var(--surface-2);color:var(--text-3);font-size:var(--fs-caption);font-weight:600}
.option-mark{width:14px;height:14px;flex:none;border:1.5px solid var(--line);border-radius:50%}
.option.is-selected{border-color:var(--brand);background:var(--brand-soft)}
.option.is-selected .option-key{background:var(--brand);color:var(--brand-on)}
.option.is-answer{border-color:var(--ok);background:var(--ok-soft)}
.option.is-answer .option-mark{background:var(--ok);border-color:var(--ok)}
.option.is-wrong{border-color:var(--danger);background:var(--danger-soft)}
.option.is-wrong .option-mark{background:var(--danger);border-color:var(--danger)}

/* 底部操作条 / 判定抽屉 */
.dock{position:sticky;bottom:calc(-1 * var(--sp-page) - 10px);z-index:6;margin:var(--sp-gap) calc(-1 * var(--sp-page)) calc(-1 * var(--sp-page) - 10px);padding:12px var(--sp-page);border-top:var(--border-w) solid var(--line);background:var(--dock-bg);box-shadow:var(--shadow-dock)}
.dock-inner{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dock-inner>.row-main{flex:1;min-width:120px}
.dock .row-actions{flex:none}
.dock.judge[data-state="correct"]{border-top-color:var(--ok)}
.dock.judge[data-state="wrong"]{border-top-color:var(--danger)}

/* 弹层 */
.scrim{position:absolute;inset:0;z-index:10;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;display:flex;flex-direction:column;max-height:76%;border-top:var(--border-w) solid var(--line);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;background:var(--sheet-bg);box-shadow:var(--shadow-sheet);overflow:hidden}
.sheet-head{display:flex;align-items:center;gap:8px;flex:none;padding:12px var(--sp-page) 8px;border-bottom:var(--border-w) solid var(--line)}
.sheet-head .t-title{flex:1}
.sheet-x{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--text-3);border-radius:var(--radius-btn)}
.sheet-body{flex:1;overflow-y:auto;padding:12px var(--sp-page);display:flex;flex-direction:column;gap:10px}
.sheet-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex:none;padding:10px var(--sp-page);border-top:var(--border-w) solid var(--line)}
.sheet-search{display:flex;gap:8px}
.picker-list{display:flex;flex-direction:column;gap:2px}
.picker-row{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 8px;border-radius:var(--radius-btn);border:var(--border-w) solid transparent}
.picker-row[aria-selected="true"]{border-color:var(--brand);background:var(--brand-soft)}
.picker-row>.t-jp{flex:1}
.detail-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.detail{display:flex;flex-direction:column;gap:0;margin:0}
.detail>div{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:var(--border-w) solid var(--line)}
.detail>div:last-child{border-bottom:0}
.detail dt{margin:0}
.detail dd{margin:0}

/* 状态反馈 */
.state-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:44px;padding:8px var(--sp-card);border:var(--border-w) solid var(--line);border-left-width:3px;border-radius:var(--radius-card);background:var(--surface)}
.state-bar[data-kind="loading"]{border-left-color:var(--brand)}
.state-bar[data-kind="error"]{border-left-color:var(--danger);background:var(--danger-soft)}
.state-bar[data-kind="ok"]{border-left-color:var(--ok);background:var(--ok-soft)}
.state-bar .t-body{flex:1;min-width:120px}
.skeleton{height:8px;width:70px;border-radius:99px;background:var(--surface-2);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);z-index:20;max-width:86%;padding:10px 16px;border:var(--border-w) solid var(--line);border-radius:var(--radius-pill);font-size:var(--fs-body);text-align:center;background:var(--toast-bg);color:var(--toast-text);box-shadow:var(--shadow-sheet)}
.toast[data-kind="ok"]{border-color:var(--ok)}
.toast[data-kind="warn"]{border-color:var(--warn)}

/* 底部标签栏 */
.tabbar{flex:none;display:flex;align-items:stretch;gap:2px;min-height:64px;padding:6px var(--sp-page);border-top:var(--border-w) solid var(--line);background:var(--tabbar-bg)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;border-radius:var(--radius-btn);color:var(--text-3)}
.tab-glyph{display:flex;align-items:center;justify-content:center;width:24px;height:24px;font-size:12px;font-weight:600;border-radius:var(--radius-glyph)}
.tab.is-on{color:var(--brand);background:var(--brand-soft)}
.tab.is-on .tab-glyph{background:var(--brand);color:var(--brand-on)}

/* 路径 / 说明 */
.pathbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:390px;margin:12px auto 0}
.pathbar>.t-micro{width:52px;flex:none;color:var(--stage-text)}
.path-list{display:flex;align-items:center;gap:4px;flex-wrap:wrap;flex:1}
.path-chip{min-height:26px;padding:2px 8px;border:1px solid var(--stage-line);border-radius:6px;font-size:10px;background:var(--stage-panel);color:var(--stage-text)}
.path-chip.is-last{border-color:var(--brand);color:var(--brand);font-weight:600}
.path-sep{font-size:11px;color:var(--stage-text)}
.legend{display:flex;flex-direction:column;gap:5px;max-width:390px;margin:10px auto 0;padding:10px;border:1px solid var(--stage-line);border-radius:9px;background:var(--stage-panel)}
.legend-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--stage-text)}
.legend-line b{font-size:12px;color:var(--stage-text)}
@media (min-width:900px){#app{max-width:520px}}

/* ---- 方案 A · 纸感延续 ---- */
/* 方案 A · 纸感延续（Paper + Accent Glass）
 * 取舍：保留现有糖果卡/墨夜纸感卡片，只在底栏、弹层、判定抽屉引入材质。
 * 材质降级作用域刻意收窄 —— 卡片永远是实色纸卡，可读性与跨版本一致性优先。
 */
:root{
  --stage-bg:#F2F4F1;--stage-panel:#FFFFFF;--stage-line:#DDE3DC;--stage-text:#5A6B60;--stage-on:#2E9463;--stage-on-text:#FFFFFF;
  --bg:#FAFAF8;--surface:#FFFFFF;--surface-2:#F2F5F0;--line:#E3E8E2;--line-strong:#C9D4CA;
  --text:#1D2B24;--text-2:#4A5C51;--text-3:#7A8A80;
  --brand:#2E9463;--brand-soft:#E9F7EF;--brand-ink:#1E6F49;--brand-on:#FFFFFF;--brand-line:#BFE3CE;--glyph-line:#D8EADD;
  --ok:#2E9463;--ok-soft:#E9F7EF;--ok-line:#BFE3CE;
  --warn:#B27A18;--warn-soft:#FBF2DE;--warn-line:#EBDBAE;
  --danger:#B34A3F;--danger-soft:#FBEAE7;
  --radius-card:20px;--radius-btn:12px;--radius-pill:999px;--radius-sheet:20px;--radius-glyph:11px;--radius-device:26px;
  --shadow-card:0 1px 2px rgba(29,43,36,.05),0 6px 16px rgba(29,43,36,.04);
  --shadow-sheet:0 -8px 28px rgba(29,43,36,.10);--shadow-device:0 12px 34px rgba(29,43,36,.12);--shadow-dock:0 -4px 14px rgba(29,43,36,.06);
  --sp-page:18px;--sp-card:14px;--sp-gap:12px;--sp-section:12px;
  --fs-display:22px;--fs-title:15px;--fs-body:13px;--fs-caption:11px;--fs-label:11px;--fs-micro:10px;--fs-jp:19px;--fs-number:20px;
  --lh-body:1.65;--fw-title:600;--border-w:1px;
  --screen-texture:repeating-linear-gradient(0deg,rgba(46,148,99,.018) 0 1px,transparent 1px 6px);
  --topbar-bg:rgba(250,250,248,.92);--tabbar-bg:rgba(255,255,255,.94);--dock-bg:#FFFFFF;--sheet-bg:#FFFFFF;
  --scrim:rgba(20,32,26,.34);--toast-bg:#25382C;--toast-text:#FFFFFF;--device-line:#DDE4DC;
  --glass-surface:rgba(255,255,255,.72);--glass-line:rgba(255,255,255,.85);
}
body[data-dark="true"]{
  --bg:#0F1114;--surface:#171A1F;--surface-2:#20252B;--line:#2C343C;--line-strong:#3D4852;
  --text:#E6ECF1;--text-2:#A9B7C2;--text-3:#778791;
  --brand:#9FBBD3;--brand-soft:#1D2A34;--brand-ink:#BBD5E8;--brand-on:#0F1114;--brand-line:#31465A;--glyph-line:#31465A;
  --ok:#8FC3A5;--ok-soft:#1A2A22;--ok-line:#2C4A38;
  --warn:#D9B166;--warn-soft:#2A2418;--warn-line:#4A3D22;
  --danger:#DE8C81;--danger-soft:#2C1E1D;
  --shadow-card:none;--shadow-sheet:0 -8px 24px rgba(0,0,0,.35);--shadow-device:0 12px 34px rgba(0,0,0,.45);--shadow-dock:none;
  --screen-texture:none;--topbar-bg:#0F1114;--tabbar-bg:#0F1114;--dock-bg:#171A1F;--sheet-bg:#171A1F;
  --scrim:rgba(0,0,0,.55);--toast-bg:#2A333C;--toast-text:#E6ECF1;--device-line:#2C343C;
  --glass-surface:rgba(23,26,31,.78);--glass-line:rgba(159,187,211,.22);
}
/* 卡片保持纸感：任何材质档都不玻璃化 .card —— 这是方案 A 的核心边界 */
.card,.prompt,.option,.empty,.state-bar{background:var(--surface)}
/* 悬浮药丸底栏（浅色）；墨夜按现有规范平铺 */
.tabbar{margin:8px 10px 10px;border:1px solid var(--line);border-top:1px solid var(--line);border-radius:999px;box-shadow:0 4px 14px rgba(29,43,36,.08)}
.tab{padding:0 2px}
body[data-dark="true"] .tabbar{margin:0;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none}
/* 交互规则：克制、单步、无层叠动画 */
.btn:active{transform:translateY(1px)}
.entry:hover,.form:hover{transform:translateY(-1px)}
.tab.is-on .tab-glyph{box-shadow:none}

/* 三档材质：只作用于底栏 / 弹层 / 判定抽屉 */
body[data-material="glass"] .tabbar,body[data-material="glass"] .sheet,body[data-material="glass"] .dock{
  background:var(--glass-surface);-webkit-backdrop-filter:blur(14px) saturate(1.45);backdrop-filter:blur(14px) saturate(1.45);
  border-color:var(--glass-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 -4px 18px rgba(29,43,36,.08)}
body[data-material="glass"] .sheet::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent)}
body[data-material="blur"] .tabbar,body[data-material="blur"] .sheet,body[data-material="blur"] .dock{
  background:var(--glass-surface);-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);border-color:var(--line)}
body[data-material="solid"] .tabbar,body[data-material="solid"] .sheet,body[data-material="solid"] .dock{
  background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none;border-color:var(--line)}
body[data-dark="true"][data-material="glass"] .tabbar,body[data-dark="true"][data-material="glass"] .sheet,body[data-dark="true"][data-material="glass"] .dock{box-shadow:inset 0 1px 0 rgba(159,187,211,.14)}
/* 状态反馈：轻描边 + 淡底，颜色与文字双通道 */
.state-bar[data-kind="ok"] .t-body::before{content:"完成 · ";font-weight:600}
.state-bar[data-kind="error"] .t-body::before{content:"失败 · ";font-weight:600}
.toast{letter-spacing:.01em}

</style>

      return '<button type="button" class="card para" data-action="sheet:word" data-para="' + i + '" aria-label="解析第 ' + (i + 1) + ' 段">' +
        '<span class="t-micro">段落 ' + (i + 1) + '</span><span class="t-jp para-jp">' + esc(t) + '</span>' +
        '<span class="t-caption">点按查看词详情与解析</span></button>';
    }).join('');
    var banner = '';
    if (status === 'loading') banner = '<div class="state-bar" data-kind="loading"><span class="t-body">解析中… 正在处理段落 2</span><span class="skeleton"></span></div>';
    if (status === 'error') banner = '<div class="state-bar" data-kind="error"><span class="t-body">解析失败 · 接口未响应</span>' + btn('重试', 'analyze', { ghost: true, small: true }) + '</div>';
    if (status === 'done') banner = '<div class="state-bar" data-kind="ok"><span class="t-body">解析完成 · 3 段 / 12 词</span>' + badge('已缓存', 'ok') + '</div>';
    return '<div class="page"><div class="hero compact"><h1 class="t-display">文章阅读</h1>' +
      '<p class="t-body">春の散歩 · 点段解析</p></div>' +
      '<div class="card"><div class="row-actions">' + btn('开始解析', 'analyze', { primary: true, small: true }) +
      badge(state.bookmarked ? '已收藏本段' : '未收藏', state.bookmarked ? 'ok' : 'muted') + '</div></div>' +
      banner + section('正文', '3 段') + paras +
      '<p class="hint">解析为本地模拟状态机，不发起任何网络或模型调用。</p></div>';

  function viewMistakes() {

      '<div class="card row-card"><div class="row-main"><span class="t-title">書く · て形</span>' +
      '<span class="t-caption">答错 2 次 · 今日到期</span></div>' + badge('待复习', 'warn') + '</div>' +

      '<span class="t-caption">答错 1 次 · 3 天后到期</span></div>' + badge('已排期', 'soft') + '</div></div>';

  function viewPractice() {
    var q = DATA.questions[state.practice.index % DATA.questions.length];
    var p = state.practice;
    var opts = q.options.map(function (o, i) {
      var cls = 'option';
      if (p.selected === i) cls += ' is-selected';

        '<div class="row-actions">' + (p.revealed ? '' : btn('看答案', 'reveal', { ghost: true, small: true })) +

  var VIEWS = {
    home: viewHome, study: viewStudy, read: viewRead, mine: viewMine,
    verb: viewVerb, practice: viewPractice, reference: viewReference,
    reader: viewReader, mistakes: viewMistakes,
  };

  /* ---------- 弹层 ---------- */
  function sheetPicker() {
    var q = state.picker.query.trim();
    var list = DATA.lexicon.filter(function (x) { return !q || x.jp.indexOf(q) >= 0 || x.kana.indexOf(q) >= 0 || x.mean.indexOf(q) >= 0; });
    var rows = list.length ? list.map(function (x) {
      var sel = state.picker.selectedId === x.id;
      return '<button type="button" class="picker-row" data-action="picker-select:' + x.id + '" aria-selected="' + sel + '">' +
        '<span class="t-jp small">' + esc(x.jp) + '</span><span class="t-caption">' + esc(x.kana) + ' · ' + esc(x.mean) + '</span>' +
        (sel ? badge('已选', 'ok') : '') + '</button>';
    }).join('') : '<div class="empty slim"><p class="t-body">没有匹配的词条</p><p class="t-caption">换个关键字试试</p></div>';
    return { title: '选择词条', body: '<div class="sheet-search"><input class="input" id="picker-input" type="text" placeholder="搜索读音或释义" value="' + esc(state.picker.query) + '" aria-label="搜索词条" data-action="picker-input"></div>' +
      '<div class="picker-list">' + rows + '</div>', foot: btn('取消', 'sheet-close', { ghost: true }) + btn('确定换词', 'picker-apply', { primary: true }) };
  }

  function sheetWord() {
    var w = DATA.word;
    return { title: '词详情', body: '<div class="detail-head"><span class="t-jp">' + esc(w.jp) + '</span>' + badge(w.pos, 'soft') + '</div>' +
      '<dl class="detail"><div><dt class="t-micro">読み</dt><dd class="t-body">' + esc(w.kana) + '</dd></div>' +
      '<div><dt class="t-micro">意味</dt><dd class="t-body">' + esc(w.mean) + '</dd></div>' +
      '<div><dt class="t-micro">文中</dt><dd class="t-body">' + esc(w.sent) + '</dd></div>' +
      '<div><dt class="t-micro">语法</dt><dd class="t-body">' + esc(w.gram) + '</dd></div></dl>',
      foot: btn('关闭', 'sheet-close', { ghost: true }) + btn(state.read.bookmarked ? '已收藏' : '收藏这个词', 'bookmark', { primary: true, disabled: state.read.bookmarked }) };
  }

  function sheetFilter() {
    return { title: '练习筛选', body: '<p class="t-body">选择本次练习涵盖的形式层级。</p>' +
      '<div class="filter-row">' +
      '<button type="button" class="pill' + (state.filter.basic ? ' is-on' : '') + '" data-action="filter:basic" aria-pressed="' + state.filter.basic + '">基础形</button>' +
      '<button type="button" class="pill' + (state.filter.advanced ? ' is-on' : '') + '" data-action="filter:advanced" aria-pressed="' + state.filter.advanced + '">进阶形</button></div>' +
      '<p class="hint">胶囊带 aria-pressed，深浅皮肤与三档材质下均保持选中可见。</p>',
      foot: btn('重置', 'filter-reset', { ghost: true }) + btn('应用', 'sheet-close', { primary: true }) };
  }

  function sheetNickname() {
    return { title: '编辑昵称', body: '<label class="t-label" for="nick-input">昵称（1–12 字）</label>' +
      '<input class="input" id="nick-input" type="text" maxlength="12" value="' + esc(state.nicknameDraft) + '" data-action="nick-input" aria-label="昵称">' +
      '<p class="hint">保存后会更新资料卡与主页问候语。</p>',
      foot: btn('取消', 'sheet-close', { ghost: true }) + btn('保存', 'save-nickname', { primary: true }) };

  var SHEETS = { picker: sheetPicker, word: sheetWord, filter: sheetFilter, nickname: sheetNickname };

  function renderSheet() {
    if (!state.sheet || !SHEETS[state.sheet]) return '';
    var s = SHEETS[state.sheet]();
    return '<div class="scrim" data-action="sheet-close"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(s.title) + '">' +
      '<div class="sheet-head"><span class="t-title">' + esc(s.title) + '</span>' +
      '<button type="button" class="sheet-x" data-action="sheet-close" aria-label="关闭">×</button></div>' +
      '<div class="sheet-body">' + s.body + '</div>' +
      '<div class="sheet-foot">' + s.foot + '</div></div>';
  }

  /* ---------- 外壳 ---------- */
  function renderTopbar() {
    if (!isSecondary()) {
      return '<div class="topbar"><div class="topbar-main"><span class="t-brand">言の葉</span>' +
        '<span class="t-caption">' + esc(meta().title) + '</span></div>' +
        '<span class="status-dot" aria-label="已同步"></span></div>';
    }
    var title = state.view === 'verb' ? state.moduleLabel : meta().title;
    return '<div class="topbar"><button type="button" class="back" data-action="back" aria-label="返回上一级">' +
      '<span aria-hidden="true">‹</span><span class="t-body">返回</span></button>' +
      '<span class="t-title">' + esc(title) + '</span><span class="topbar-spacer"></span></div>';
  }

  function tabGlyph(id, fallback) {
    // 方案 B 用矢量图标（内联 SVG，颜色走 currentColor）；A / C 保留文字字形不参与改动
    if (state.plan === 'b' && ICONS[id]) {
      return '<span class="tab-glyph tab-glyph-icon" aria-hidden="true">' + ICONS[id] + '</span>';
    }
    return '<span class="tab-glyph" aria-hidden="true">' + fallback + '</span>';
  }

  function renderTabbar() {
    if (isSecondary()) return '';
    var tabs = [['home', '主页', '主'], ['study', '学习', '学'], ['read', '阅读', '読'], ['mine', '我的', '我']];
    return '<nav class="tabbar" aria-label="主导航">' + tabs.map(function (t) {
      var on = state.view === t[0];
      return '<button type="button" class="tab' + (on ? ' is-on' : '') + '" data-action="tab:' + t[0] + '" aria-current="' + (on ? 'page' : 'false') + '" aria-label="' + t[1] + '">' +
        tabGlyph(t[0], t[2]) + '<span class="t-micro">' + t[1] + '</span></button>';
    }).join('') + '</nav>';
  }

  function renderToast() {
    if (!state.toast) return '';
    return '<div class="toast" data-kind="' + state.toastKind + '" role="status">' + esc(state.toast) + '</div>';
  }

  function renderScreen() {
    var showTab = !isSecondary();
    return '<div class="screen-shell">' + renderTopbar() +
      '<main class="content' + (showTab ? ' has-island' : '') + '" id="content">' + (VIEWS[state.view] || viewHome)() + '</main>' +
      renderTabbar() + renderSheet() + renderToast() + '</div>';
  }

  function renderPathbar() {
    var chips = state.history.map(function (v, i) {
      return '<button type="button" class="path-chip' + (i === state.history.length - 1 ? ' is-last' : '') + '" data-action="path-back:' + i + '">' +
        esc((VIEW_META[v] || {}).title || v) + '</button>';
    }).join('<span class="path-sep" aria-hidden="true">›</span>');
    return '<div class="pathbar"><span class="t-micro">操作路径</span><div class="path-list">' + chips + '</div></div>';
  }

  function materialLabel() { return { glass: '液态玻璃', blur: '背景模糊', solid: '半透明' }[state.material]; }
  function dockLabel() { return { overlay: '覆盖悬浮', inline: '占位悬浮', compact: '收窄居中' }[state.dock]; }

  function renderLegend() {
    var m = PLAN_META[state.plan];
    return '<div class="legend"><div class="legend-line"><b>' + esc(m.name) + '</b>' + badge(m.tag, 'soft') +
      '<span class="t-micro">' + esc(m.note) + '</span></div>' +
      '<div class="legend-line"><span class="t-micro">皮肤 ' + (state.dark ? '墨夜' : '糖果卡') + ' · 材质 ' + materialLabel() +
        (state.plan === 'b' ? ' · 底栏 ' + dockLabel() : '') +
        ' · 场景 ' + esc(meta().title) + ' · 状态 ' + state.inject + '</span></div>' +
      '<div class="legend-line"><span class="t-micro">可用性：焦点可见 / 热区 ≥44px / selected 与 aria-pressed / Esc 关弹层 / 状态双通道</span></div></div>';
  }

  function renderToolbar() {
    var views = Object.keys(VIEW_META).map(function (v) {
      return '<option value="' + v + '"' + (state.view === v ? ' selected' : '') + '>' + esc(VIEW_META[v].title) + '</option>';
    }).join('');
    function seg(name, items, cur) {
      return '<div class="seg" role="group" aria-label="' + name + '">' + items.map(function (it) {
        return '<button type="button" class="seg-btn' + (cur === it[0] ? ' is-on' : '') + '" data-action="' + it[2] + ':' + it[0] + '" aria-pressed="' + (cur === it[0]) + '">' + it[1] + '</button>';
      }).join('') + '</div>';
    }
    return '<div class="toolbar">' +
      '<div class="toolbar-row"><span class="t-micro">皮肤</span>' + seg('皮肤', [['0', '糖果卡', 'set-dark'], ['1', '墨夜', 'set-dark']], state.dark ? '1' : '0') + '</div>' +
      '<div class="toolbar-row"><span class="t-micro">材质</span>' + seg('材质', [['glass', '液态玻璃', 'set-material'], ['blur', '背景模糊', 'set-material'], ['solid', '半透明', 'set-material']], state.material) + '</div>' +
      (state.plan === 'b' ? '<div class="toolbar-row"><span class="t-micro">底栏</span>' + seg('底栏浮法', [['overlay', '覆盖', 'set-dock'], ['inline', '占位', 'set-dock'], ['compact', '收窄', 'set-dock']], state.dock) + '</div>' : '') +
      (state.plan === 'b' ? '<div class="toolbar-row"><span class="t-micro">圆角</span>' + seg('全局圆角', [['24', '24', 'set-radius'], ['20', '20', 'set-radius'], ['16', '16', 'set-radius']], state.radius) + '</div>' : '') +
      '<div class="toolbar-row"><span class="t-micro">场景</span><select class="select" id="view-select" aria-label="跳转场景">' + views + '</select></div>' +
      '<div class="toolbar-row"><span class="t-micro">状态</span>' + seg('状态注入', [['normal', '正常', 'inject'], ['empty', '空态', 'inject'], ['loading', '加载', 'inject'], ['error', '错误', 'inject']], state.inject) + '</div>' +
      '<div class="toolbar-row"><span class="t-micro">操作</span>' + btn('重置', 'reset', { ghost: true, small: true }) + btn('Toast', 'toast:info', { ghost: true, small: true }) + '</div>' +
      '</div>';
  }

  function render() {
    var root = document.getElementById('app');
    if (!root) return;
    // CSS 令牌与三档材质规则挂在 body 属性上，必须与状态同步，否则按钮变了样式不变
    document.body.setAttribute('data-dark', state.dark ? 'true' : 'false');
    document.body.setAttribute('data-material', state.material);
    // 底栏浮法只对方案 B 生效，A/C 不消费该属性
    document.body.setAttribute('data-dock', state.plan === 'b' ? state.dock : 'none');
    // 全局圆角单值：只改这一个令牌，卡片/按钮/输入框/弹层/岛一起变（仅 B 消费）
    if (state.plan === 'b') document.documentElement.style.setProperty('--radius', state.radius + 'px');
    else document.documentElement.style.removeProperty('--radius');
    root.innerHTML = renderToolbar() + '<div class="device"><div class="device-inner" id="screen">' + renderScreen() + '</div></div>' + renderPathbar() + renderLegend();
    var sel = document.getElementById('view-select');
    if (sel) sel.addEventListener('change', function () { go(sel.value); });
    if (state.sheet === 'picker') {
      var input = document.getElementById('picker-input');
      if (input && state.picker.focus) { input.focus(); try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {} state.picker.focus = false; }
    }
    if (state.sheet === 'nickname') {
      var ni = document.getElementById('nick-input');
      if (ni && state.nicknameFocus) { ni.focus(); state.nicknameFocus = false; }
    }
  }

  /* ---------- 状态与动作 ---------- */
  var toastTimer = null;
  function toast(msg, kind) {
    state.toast = msg; state.toastKind = kind || 'info';
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { state.toast = null; render(); }, 2400);
  }

  function go(view) {
    if (!VIEW_META[view]) return;
    if (state.view !== view) state.history.push(view);
    state.view = view; state.sheet = null;
    render();
    var nc = document.getElementById('content');
    if (nc) nc.scrollTop = 0;
  }

  function back() {
    if (state.sheet) { state.sheet = null; render(); return; }
    if (state.history.length > 1) {
      state.history.pop();
      var v = state.history[state.history.length - 1];
      state.view = v; render();
    } else { state.view = 'home'; render(); }
  }

  function act(a, el) {
    var parts = a.split(':'); var op = parts[0], arg = parts.slice(1).join(':');
    switch (op) {
      case 'tab': go(arg); break;
      case 'back': back(); break;
      case 'path-back': {
        var i = parseInt(arg, 10);
        state.history = state.history.slice(0, i + 1);
        state.view = state.history[i] || 'home'; state.sheet = null; render(); break;
      }
      case 'open': {
        if (arg === 'verb' && el) {
          var m = el.getAttribute('data-module');
          state.moduleLabel = ({ verb: '动词', adj: '形容词', particle: '助词' })[m] || '动词';
        }
        go(arg); break;
      }
      case 'planned': toast('规划中，暂未开放（不做假交互）', 'warn'); break;
      case 'proverb': state.proverb = (state.proverb + 1) % DATA.proverbs.length; render(); toast('已换一句谚语', 'info'); break;
      case 'option': state.practice.selected = parseInt(arg, 10); render(); break;
      case 'submit': {
        var q = DATA.questions[state.practice.index % DATA.questions.length];
        if (state.practice.selected === null) { toast('请先选择一个答案', 'warn'); break; }
        state.practice.judged = state.practice.selected === q.answer ? 'correct' : 'wrong';
        render(); toast(state.practice.judged === 'correct' ? '正确' : '答错了，看看解析', state.practice.judged === 'correct' ? 'ok' : 'warn'); break;
      }
      case 'reveal': state.practice.revealed = true; render(); break;
      case 'next': state.practice.index++; state.practice.selected = null; state.practice.judged = null; state.practice.revealed = false; render(); break;
      case 'sheet': state.sheet = arg; if (arg === 'nickname') { state.nicknameDraft = state.nick; state.nicknameFocus = true; } render(); break;
      case 'sheet-close': state.sheet = null; render(); break;
      case 'picker-select': state.picker.selectedId = arg; render(); break;
      case 'picker-apply': state.picker.currentId = state.picker.selectedId; state.sheet = null; render(); toast('已切换词条', 'ok'); break;
      case 'filter': state.filter[arg] = !state.filter[arg]; render(); break;
      case 'filter-reset': state.filter = { basic: true, advanced: false }; render(); break;
      case 'save-nickname': {
        var n = state.nicknameDraft.trim();
        if (!n) { toast('昵称不能为空', 'warn'); break; }
        state.nick = n; state.sheet = null; render(); toast('资料卡已更新', 'ok'); break;
      }
      case 'bookmark':
        if (state.read.bookmarked) { toast('这个词已经收藏过了', 'info'); break; }
        state.read.bookmarked = true; state.bookmarked = true; render(); toast('已收藏这个词', 'ok'); break;
      case 'analyze': {
        state.read.status = 'loading'; render();
        setTimeout(function () {
          state.read.status = state.inject === 'error' ? 'error' : 'done';
          render();
          toast(state.read.status === 'error' ? '解析失败，可重试' : '解析完成（本地模拟）', state.read.status === 'error' ? 'warn' : 'ok');
        }, 900); break;
      }
      case 'toast': {
        var msg = { ok: '操作成功', warn: '需要注意', info: '这是一条状态提示' }[arg] || '这是一条状态提示';
        toast(msg, arg); break;
      }
      case 'set-dark': state.dark = arg === '1'; render(); break;
      case 'set-material': state.material = arg; render(); break;
      case 'set-dock': state.dock = arg; render(); break;
      case 'set-radius': state.radius = arg; render(); break;
      case 'set-view': go(arg); break;
      case 'inject': {
        state.inject = arg;
        if (arg === 'loading') state.read.status = 'loading';
        else if (arg === 'error') state.read.status = 'error';
        else if (arg === 'empty') state.read.status = 'idle';
        else state.read.status = 'idle';
        render(); toast('已注入状态：' + arg, 'info'); break;
      }
      case 'reset': {
        state.view = 'home'; state.history = ['home']; state.sheet = null; state.dark = false;
        state.material = 'glass'; state.inject = 'normal'; state.toast = null; state.dock = 'overlay'; state.radius = '24';
        state.proverb = 0; state.moduleLabel = '动词'; state.nick = '关子'; state.nicknameDraft = '关子';
        state.practice = { index: 0, selected: null, judged: null, revealed: false };
        state.picker = { query: '', selectedId: 'kaku', currentId: 'kaku' };
        state.read = { status: 'idle', bookmarked: false, activeWord: false };
        state.bookmarked = false; state.filter = { basic: true, advanced: false };
        render(); break;
      }
      default: break;
    }
  }

  function init() {
    var body = document.body;
    state.plan = body.getAttribute('data-plan') || 'a';
    document.addEventListener('click', function (e) {
      var el = e.target.closest ? e.target.closest('[data-action]') : null;
      if (!el) return;
      var a = el.getAttribute('data-action');
      if (!a || a === 'picker-input' || a === 'nick-input') return;
      e.preventDefault();
      act(a, el);
    });
    document.addEventListener('input', function (e) {
      var t = e.target;
      if (t && t.id === 'picker-input') { state.picker.query = t.value; state.picker.focus = true; render(); }
      if (t && t.id === 'nick-input') { state.nicknameDraft = t.value; }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (state.sheet) { state.sheet = null; render(); }
      else if (isSecondary()) { back(); }
    });
    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
</html>
